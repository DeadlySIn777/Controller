[EMC]
VERSION = 1.1
MACHINE = Controller Lab SOFTWARE ONLY
DEBUG = 0

[DISPLAY]
DISPLAY = /work/controller_backend/profiles/sim/display-client
CYCLE_TIME = 0.05

[CONTROLLER_LAB]
MODE = simulation

[RS274NGC]
PARAMETER_FILE = simulation.var
RS274NGC_STARTUP_CODE = G21 G17 G90 G94 G40 G49 G80

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
HALFILE = simulation.hal

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 5
MAX_LINEAR_VELOCITY = 20
MAX_LINEAR_ACCELERATION = 100
NO_FORCE_HOMING = 0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tools.tbl

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[AXIS_X]
MIN_LIMIT = -50
MAX_LIMIT = 50
MAX_VELOCITY = 20
MAX_ACCELERATION = 100

[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = -50
MAX_LIMIT = 50
MAX_VELOCITY = 20
MAX_ACCELERATION = 100
FERROR = 1
MIN_FERROR = 0.01
HOME = 0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0

[AXIS_Y]
MIN_LIMIT = -50
MAX_LIMIT = 50
MAX_VELOCITY = 20
MAX_ACCELERATION = 100

[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = -50
MAX_LIMIT = 50
MAX_VELOCITY = 20
MAX_ACCELERATION = 100
FERROR = 1
MIN_FERROR = 0.01
HOME = 0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 1

[AXIS_Z]
MIN_LIMIT = -50
MAX_LIMIT = 50
MAX_VELOCITY = 20
MAX_ACCELERATION = 100

[JOINT_2]
TYPE = LINEAR
MIN_LIMIT = -50
MAX_LIMIT = 50
MAX_VELOCITY = 20
MAX_ACCELERATION = 100
FERROR = 1
MIN_FERROR = 0.01
HOME = 0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 2
